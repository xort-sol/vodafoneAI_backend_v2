[project]
name = "sales-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "livekit-agents[elevenlabs,silero]~=1.8",
    "livekit-api>=1.2.2",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = ["eval: persona eval, slow and uses LLM credits; run with: uv run pytest -m eval"]
addopts = "-m 'not eval'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/shared", "src/dialler", "src/analysis"]
